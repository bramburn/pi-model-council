# Gitleaks 8.x config — allow fake test API keys in __tests__/
# Use single [allowlist] map (not [[allowlist]] array table).

[allowlist]
description = "Allow fake test API keys and third-party artifacts"
paths = [
  '''__tests__/.*''',
  '''node_modules/''',
  '''coverage/''',
  '''dist/''',
  '''.git/''',
]
regexes = [
  '''sk-or-v1-[a-z]+[a-z0-9]*''',
]
