# Gitleaks 8.x config for pi-model-council
# Ignore test fixture API keys (sk-or-v1-test*) in __tests__ directories

[allowlist]
description = "Allow fake test API keys and third-party dirs"
paths = [
  '''node_modules/''',
  '''coverage/''',
  '''dist/''',
  '''.git/''',
]

[[allowlist]]
description = "Allow sk-or-v1- prefixed fake test keys in test files"
path = '''__tests__.*'''
regex = '''sk-or-v1-[a-z]+[a-z0-9]*'''
