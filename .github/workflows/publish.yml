name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.6.0). Leave blank to use the pushed tag.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # required for provenance attestation (used with publishConfig.provenance)

jobs:
  publish:
    name: Publish @bramburn/pi-model-council to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::Tag $TAG does not match package.json version v${PKG_VERSION}"
            exit 1
          fi
          echo "Tag $TAG matches package.json version ${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Run prepublish checks (lint, typecheck, test)
        run: npm run prepublishOnly

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm package is live
        run: |
          sleep 5
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Checking registry for ${PKG_NAME}@${PKG_VERSION} ..."
          npm view "${PKG_NAME}@${PKG_VERSION}" version